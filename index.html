<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交班站</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交班站">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f5c68">
<style>
  html, body { margin: 0; min-height: 100%; background: #faf9f5; color: #1b2420;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .wrap { min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 32px 24px; text-align: center; box-sizing: border-box; }
  .logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 12px 30px -12px rgba(0,0,0,.35); }
  h1 { font-size: 22px; font-weight: 700; color: #1f5c68; margin: 18px 0 4px; }
  p { color: #5e6b65; font-size: 13.5px; line-height: 1.7; margin: 0 0 22px; max-width: 300px; }
  a.go { display: inline-flex; align-items: center; gap: 8px; background: #1f5c68; color: #fff;
    text-decoration: none; padding: 14px 30px; border-radius: 14px; font-weight: 600; font-size: 16px;
    box-shadow: 0 8px 20px -8px rgba(31,92,104,.6); }
  a.go:active { filter: brightness(.92); }
  .hint { margin-top: 26px; font-size: 12px; color: #8b968f; line-height: 1.7; max-width: 300px; }
  .hint b { color: #5e6b65; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <img class="logo" src="icon-192.png" alt="交班站">
  <h1>交班站</h1>
  <p>醫院資安小組的交接站</p>
  <a class="go" id="go" href="#">開啟交班站 →</a>
  <div class="hint">
    第一次用:點右下角 <b>分享</b> → <b>加入主畫面</b>,
    之後從主畫面的圖示點進來就會直接開。
  </div>
</div>
<script>
  (function () {
    var EXEC = "https://script.google.com/a/macros/g.ntu.edu.tw/s/AKfycbwI3l1JIIY1I00JshvLIRxwNwbRj-EWaMh2LmcKTycF9s2_z4rgzFjLfCr9zRqNo0ghbA/exec";
    document.getElementById('go').href = EXEC;
    var standalone = (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (standalone) {
      // 從主畫面圖示開啟 → 直接進 App(頂層導向,Google 登入正常運作)
      location.replace(EXEC);
    }
  })();
</script>
</body>
</html>
